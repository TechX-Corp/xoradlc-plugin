id: kiro
display_name: Kiro CLI
prerequisites:
  - command: kiro-cli
    required: false
    note: Warn if missing; install may still proceed.
mcp:
  name: xora-dlc
  config_path: .kiro/settings/mcp.json
artifacts:
  agents_md: .kiro/steering/xora-dlc.md
  skills_dir: .kiro/skills
  hooks_dir: .kiro/hooks
# Shared standards → host paths (setup copies; remove deletes tracked dests)
standards:
  - source: MCP_ROUTING.md
    dest: .kiro/steering/MCP_ROUTING.md
hooks:
  - source: hooks/xora-usage-stop.json
    dest: .kiro/hooks/xora-usage-stop.json
setup:
  strategy: copy_files
remove:
  strategy: delete_tracked
