# Build multi-OS xdlc binaries and publish a GitHub Release when a v* tag is pushed.
# Tags are usually created by the tag-release job in xdlc-plugin-tests.yml after main smoke passes.
# Manual tags must point at a commit on BASE_BRANCH (see AGENTS.md); otherwise this job fails before build.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with BASE_BRANCH in AGENTS.md
  BASE_BRANCH: main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on BASE_BRANCH
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          tip="origin/$BASE_BRANCH"
          head=$(git rev-parse HEAD)
          echo "tag commit:  $head"
          echo "BASE_BRANCH: $tip ($(git rev-parse "$tip"))"
          if ! git merge-base --is-ancestor HEAD "$tip"; then
            echo "::error::Release tag must point to a commit reachable from origin/${BASE_BRANCH}."
            echo "This commit is not an ancestor of ${tip}. Merge to ${BASE_BRANCH} first, then retag."
            exit 1
          fi
          echo "OK: tagged commit is on ${BASE_BRANCH} history."

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${pair%/*}
            arch=${pair#*/}
            out="dist/xdlc-${os}-${arch}"
            if [ "$os" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/xdlc
          done
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
