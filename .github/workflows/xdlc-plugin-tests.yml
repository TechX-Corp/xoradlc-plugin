# Kiểm lệnh xdlc và plugin xora-dev trên macOS, Linux, Windows (Python 3.9 và 3.13):
# cài qua install.sh / install.ps1, setup / remove, OAuth + MCP proxy với backend giả, sensor, hook Claude,
# menu phím mũi tên (pty, chỉ macOS / Linux). Chạy test_roles.py, không ra mạng.
name: xdlc & plugin tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cross-platform:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # ubuntu-latest (26.04) has no prebuilt Python 3.9: test 3.9 on Ubuntu 22.04
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run test_roles.py
        run: python test_roles.py
