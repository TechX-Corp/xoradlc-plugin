# Go unit tests + cross-platform smoke (install, setup, OAuth/MCP against a fake backend, sensor, TTY menus).
name: xdlc & plugin tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cross-platform:
    name: ${{ matrix.os }} · smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: go test
        run: go test ./...
      - name: Build xdlc
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o xdlc.exe ./cmd/xdlc
          else
            go build -o xdlc ./cmd/xdlc
          fi
      - name: Smoke (scripts/smoke_xdlc.py)
        run: python scripts/smoke_xdlc.py